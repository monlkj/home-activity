<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>우리집 포인트 · 작은 실천, 함께하는 행복</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="locked">
    <section id="login-screen" aria-label="가족 로그인"></section>
    <aside class="sidebar">
      <a class="brand" href="/"
        >⌂ <span>우리집 포인트<small>HOME, SWEET HOME</small></span></a
      >
      <p class="nav-label">우리 가족 공간</p>
      <nav>
        <button data-tab="home" class="active">◫ <span>대시보드</span></button
        ><button data-tab="activities">☑ <span>활동 목록</span></button
        ><button data-tab="rewards">♧ <span>보상 상점</span></button
        ><button data-tab="history">◷ <span>포인트 내역</span></button>
      </nav>
      <div class="side-bottom">
        <div class="plant">🌱</div>
        <strong>작은 실천이 쌓이면<br />우리 집이 더 행복해져요.</strong>
        <p>오늘도 함께 한 걸음!</p>
        <button id="add-member">＋ 가족 구성원 추가</button>
      </div>
    </aside>
    <main>
      <header>
        <div class="breadcrumb">
          우리 가족 공간 <span>/</span> <b id="page-label">대시보드</b>
        </div>
        <div>
          <span id="session-name" class="house-tag"></span>
          <button id="family-lobby" class="text-button">가족방</button
          ><button id="account-settings" class="text-button">
            승인 비밀번호</button
          ><button id="logout" class="text-button">로그아웃</button
          ><button id="delete-account" class="text-button danger-text">
            계정 삭제
          </button>
        </div>
      </header>
      <section class="page">
        <div class="heading">
          <div>
            <p class="eyebrow">A LITTLE EVERY DAY</p>
            <h1 id="page-title">작은 실천, 큰 행복 <span>🌿</span></h1>
            <p id="page-subtitle">
              함께 실천하고, 포인트를 모으고, 즐거운 보상을 만나보세요.
            </p>
          </div>
          <span id="today"></span>
        </div>
        <div id="content"></div>
        <footer>우리 가족만의 작은 약속, 우리집 포인트</footer>
      </section>
    </main>
    <dialog id="dialog">
      <form id="form">
        <div class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button type="button" id="close-dialog" aria-label="닫기">×</button>
        </div>
        <div id="fields"></div>
        <p id="form-error" role="alert"></p>
        <button class="primary" type="submit">저장하기</button>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
